name: Build Shulker Preview

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: shulker-preview/shulker-preview

      - name: Build mod
        run: ./gradlew build --no-daemon
        working-directory: shulker-preview/shulker-preview

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Shulker-Preview-Mod
          path: shulker-preview/shulker-preview/build/libs/*.jar
          if-no-files-found: error
